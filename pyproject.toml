[project]
name = "fastapi-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "Yago Vinicius",email = "yagoviniciusribeiro05@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.153.0,<0.154.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "tzdata (>=2026.6,<2027.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "typos (>=1.51.1,<2.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "pyright[nodejs] (>=1.1.414,<2.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'UP', 'B', 'SIM', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
exclude = ["migrations", ".venv"]

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fastapi_zero', '--cov-context=test']
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.poe] 
poetry_command = ""
executor.type = "virtualenv"
  
[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos" },
  { cmd = "ruff check" },
  { cmd = "pyright" },
]
format.sequence = [
  { cmd = "ruff format" },
  { cmd = "ruff check --fix" },
]
serve = "fastapi dev fastapi_zero/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]